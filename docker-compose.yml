# Postgres local (mesma major do Neon) para testes de integração e ensaio de migrações.
# Só para desenvolvimento: senha fixa, porta apenas em localhost.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
